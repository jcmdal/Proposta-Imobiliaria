<style>
/* Layout: work tool. Sticky top bar with role tabs; each view is one column on phone, list + detail on desktop. Same family as the Mirante 340 page (night indigo, window-light amber), but light-first because people fill forms here. */
:root{
  --bg:#f2f3f8;
  --surface:#ffffff;
  --sunk:#e8eaf3;
  --ink:#121839;
  --muted:#596086;
  --line:#d9dcea;
  --lamp:#f2b84b;
  --lamp-ink:#1c1405;
  --lamp-deep:#9a6408;
  --pend:#2d55c8; --pend-bg:#e6ecfc;
  --fix:#b5450b; --fix-bg:#fdebdf;
  --ok:#137a3b; --ok-bg:#dff3e6;
  --off:#5e6480; --off-bg:#e7e8ef;
  --display:"Gloock","Iowan Old Style","Times New Roman",serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a0f2c;--surface:#111943;--sunk:#0d1438;--ink:#eef1ff;--muted:#a3acd6;--line:#27306a;
  --lamp:#f6c66b;--lamp-ink:#1c1405;--lamp-deep:#f6c66b;
  --pend:#9db6ff;--pend-bg:#1c2a66;--fix:#ffb489;--fix-bg:#4a2513;--ok:#86e0a5;--ok-bg:#143d27;--off:#b3b9da;--off-bg:#232b5c;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a0f2c;--surface:#111943;--sunk:#0d1438;--ink:#eef1ff;--muted:#a3acd6;--line:#27306a;
  --lamp:#f6c66b;--lamp-ink:#1c1405;--lamp-deep:#f6c66b;
  --pend:#9db6ff;--pend-bg:#1c2a66;--fix:#ffb489;--fix-bg:#4a2513;--ok:#86e0a5;--ok-bg:#143d27;--off:#b3b9da;--off-bg:#232b5c;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pend);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;line-height:1.1}
h2{font-size:clamp(24px,3.4vw,32px)}
h3{font-size:20px}
p{margin:0}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.1;margin-right:auto}
.brand b{font-family:var(--display);font-weight:400;font-size:21px}
.brand span{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.role{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--sunk);color:var(--ink)}
.tabs{display:flex;gap:2px;padding:3px;border-radius:10px;background:var(--sunk);overflow-x:auto;scrollbar-width:none;max-width:100%}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:transparent;border-radius:8px;padding:7px 14px;font-size:14px;font-weight:500;color:var(--muted);cursor:pointer;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tabs button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(10,15,44,.12)}
.tabs .n{font-family:var(--mono);font-size:11px;background:var(--lamp);color:var(--lamp-ink);border-radius:999px;padding:0 6px;line-height:17px}
@media (max-width:700px){.tabs{order:3;width:100%}.tabs button{flex:1;justify-content:center}}

main{padding-block:24px 64px}
.view{display:flex;flex-direction:column;gap:22px}
.head{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap}
.head p{color:var(--muted);max-width:60ch;margin-top:6px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;cursor:pointer;background:var(--surface);color:var(--ink);text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.lamp{background:var(--lamp);border-color:var(--lamp);color:var(--lamp-ink)}
.btn.lamp:hover{filter:brightness(1.05)}
.btn.warn{color:var(--fix);border-color:currentColor;background:transparent}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--pend);cursor:pointer;font-size:13.5px;text-decoration:underline;text-underline-offset:2px}

/* status pills */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-pendente{color:var(--pend);background:var(--pend-bg)}
.st-ajuste{color:var(--fix);background:var(--fix-bg)}
.st-publicado{color:var(--ok);background:var(--ok-bg)}
.st-vendido,.st-arquivado{color:var(--off);background:var(--off-bg)}
.tag3d{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;padding:2px 7px;border-radius:5px;background:var(--ink);color:var(--surface)}

/* summary strip */
.strip{display:grid;grid-template-columns:minmax(0,1.6fr) repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.strip>div{background:var(--surface);padding:16px 18px;display:flex;flex-direction:column;gap:6px;min-width:0}
.strip .big{font-family:var(--display);font-size:34px;line-height:1}
.strip .big small{font-family:var(--mono);font-size:13px;color:var(--muted);margin-left:4px}
.quota{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.quota i{display:block;height:100%;background:var(--lamp)}
.quota.over i{background:var(--fix)}
.strip select{border:1px solid var(--line);border-radius:8px;padding:4px 8px;background:var(--surface);font-size:13px;max-width:100%}
.plan-row{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
@media (max-width:760px){.strip{grid-template-columns:repeat(3,minmax(0,1fr))}.strip>div:first-child{grid-column:1/-1}.strip .big{font-size:28px}}

/* filters */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);font-weight:600}

/* list */
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;cursor:pointer;width:100%}
.row:last-child{border-bottom:0}
.row:hover{background:var(--sunk)}
.thumb{width:64px;height:52px;border-radius:8px;background:var(--sunk);object-fit:cover;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:10px;color:var(--muted);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.row .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .r{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.row .v{font-family:var(--mono);font-size:13.5px}
.meter{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;color:var(--muted)}
.meter i{width:38px;height:4px;border-radius:2px;background:var(--sunk);position:relative;overflow:hidden;display:inline-block}
.meter i b{position:absolute;inset:0 auto 0 0;background:var(--ok)}
.meter.low i b{background:var(--fix)}
.empty{padding:36px 22px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty b{font-family:var(--display);font-weight:400;font-size:22px;color:var(--ink)}
.empty p{max-width:46ch}

/* sheet (detail) */
.scrim{position:fixed;inset:0;background:rgba(8,12,36,.45);z-index:50}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);z-index:51;display:flex;flex-direction:column;border-left:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.sheet-b{overflow:auto;padding:18px;display:flex;flex-direction:column;gap:18px}
.sheet-f{border-top:1px solid var(--line);padding:12px 18px;display:flex;gap:8px;flex-wrap:wrap}
.x{border:0;background:var(--sunk);border-radius:8px;width:34px;height:34px;font-size:18px;cursor:pointer}
.gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.gallery a,.gallery div{aspect-ratio:4/3;border-radius:8px;overflow:hidden;background:var(--sunk);display:block;max-width:100%}
.gallery a:first-child{grid-column:span 2;grid-row:span 2}
.gallery img{width:100%;height:100%;object-fit:cover;display:block}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 14px}
.facts dt{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.facts dd{margin:2px 0 0;font-weight:600;font-size:14.5px;overflow-wrap:anywhere}
.check{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14px}
.check li{display:flex;gap:8px;align-items:flex-start}
.check li::before{content:"";flex:none;width:16px;height:16px;margin-top:2px;border-radius:4px;border:1.5px solid var(--line)}
.check li.ok{color:var(--muted)}
.check li.ok::before{background:var(--ok);border-color:var(--ok)}
.check li.miss::before{border-color:var(--fix)}
.note{border-radius:10px;padding:12px 14px;background:var(--fix-bg);color:var(--ink);font-size:14px}
.note b{color:var(--fix);display:block;font-size:12px;font-family:var(--mono);letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
.hist{font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13.5px;padding:10px 12px;border-radius:10px;background:var(--sunk);width:100%}

/* form */
.formgrid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
@media (max-width:900px){.formgrid{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}
fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:14px;min-width:0}
fieldset+fieldset{border-top:1px solid var(--line);padding-top:20px}
legend{font-family:var(--display);font-size:20px;padding:0;margin-bottom:4px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:560px){.grid3,.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2.st{grid-template-columns:1fr}}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f label,.lab{font-size:13px;color:var(--muted);font-weight:500}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);font-size:15px;min-width:0}
.f textarea{min-height:110px;resize:vertical}
.f .hint{font-size:12px;color:var(--muted)}
.f.bad input,.f.bad select{border-color:var(--fix)}
.seg{display:flex;gap:2px;padding:3px;border-radius:10px;background:var(--sunk);width:fit-content;max-width:100%;flex-wrap:wrap}
.seg label{position:relative;cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;padding:7px 14px;border-radius:8px;font-size:14px;color:var(--muted)}
.seg input:checked+span{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(10,15,44,.12)}
.seg input:focus-visible+span{outline:2px solid var(--pend)}
.tick{display:flex;gap:10px;align-items:flex-start;font-size:14px;cursor:pointer}
.tick input{width:18px;height:18px;margin:1px 0 0;accent-color:var(--ink);flex:none}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts label{cursor:pointer;position:relative}
.opts input{position:absolute;opacity:0;pointer-events:none}
.opts span{display:block;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13.5px;color:var(--muted);background:var(--bg)}
.opts input:checked+span{border-color:var(--ink);color:var(--ink);background:var(--surface);font-weight:600}
.opts input:focus-visible+span{outline:2px solid var(--pend)}
.drop{border:1.5px dashed var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;align-items:flex-start;background:var(--bg)}
.drop.over{border-color:var(--pend)}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;width:100%}
.ph{position:relative;aspect-ratio:4/3;border-radius:8px;overflow:hidden;background:var(--sunk);max-width:100%}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .cap{position:absolute;left:4px;top:4px;font-family:var(--mono);font-size:9.5px;background:var(--lamp);color:var(--lamp-ink);padding:1px 5px;border-radius:4px}
.ph button{position:absolute;right:4px;top:4px;width:24px;height:24px;border-radius:6px;border:0;background:rgba(8,12,36,.7);color:#fff;cursor:pointer;font-size:14px;line-height:1}
.ph.loading{display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted);font-family:var(--mono)}
.side{position:sticky;top:84px;display:flex;flex-direction:column;gap:14px}
@media (max-width:900px){.side{position:static}}
.score{display:flex;align-items:baseline;gap:8px}
.score b{font-family:var(--display);font-weight:400;font-size:44px;line-height:1}
.score span{color:var(--muted);font-size:13px}
.err{color:var(--fix);font-size:13.5px}
.okmsg{color:var(--ok);font-size:14px;font-weight:600}
.profile{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.profile .pn{font-weight:600}
.profile .pc{font-size:13px;color:var(--muted)}

/* vitrine */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.vc{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.vc .img{aspect-ratio:4/3;background:var(--sunk);position:relative;max-width:100%}
.vc .img img{width:100%;height:100%;object-fit:cover;display:block}
.vc .img .noimg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;color:var(--muted)}
.vc .img .sold{position:absolute;inset:0;background:rgba(8,12,36,.6);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:26px}
.vc .code{position:absolute;left:10px;top:10px;font-family:var(--mono);font-size:11px;background:var(--surface);color:var(--ink);padding:2px 7px;border-radius:5px}
.vc .bd{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.vc .price{font-family:var(--display);font-size:26px;line-height:1.1}
.vc .loc{font-size:13.5px;color:var(--muted)}
.vc .specs{display:flex;gap:12px;flex-wrap:wrap;font-family:var(--mono);font-size:12.5px}
.vc .feat{display:flex;gap:4px;flex-wrap:wrap}
.vc .feat span{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--muted)}
.vc .act{margin-top:auto;padding-top:8px;display:flex;gap:8px;flex-wrap:wrap}
.notice{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;gap:6px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}}}
</style>

<style>
.tablink{display:flex;align-items:center;padding:7px 14px;border-radius:8px;font-size:14px;font-weight:500;color:var(--muted);text-decoration:none;white-space:nowrap}
.tablink:hover{color:var(--ink)}
.auth{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,420px);gap:32px;align-items:center;padding-block:clamp(16px,6vw,64px)}
.auth-intro{display:flex;flex-direction:column;gap:10px}
.auth-intro h2{font-size:clamp(28px,4vw,40px)}
.auth-intro p{color:var(--muted);max-width:48ch}
@media (max-width:760px){.auth{grid-template-columns:1fr}}
button.img{border:0;padding:0;width:100%;display:block;cursor:pointer;color:inherit}
.who .link{font-size:13px}
</style>

</head>

const EXCEDENTE = 15;
const TIPOS = ["Apartamento","Cobertura","Casa","Casa em condomínio","Terreno / lote","Comercial"];
const DIFS = ["Vista para a lagoa","Perto da praia","Piscina","Área gourmet","Varanda","Portaria 24h","Elevador","Aceita pet","Mobiliado","Energia solar","Quintal","Condomínio fechado"];
const STATUS = { pendente:"Aguardando revisão", ajuste:"Ajuste pedido", publicado:"Na vitrine", vendido:"Vendido", arquivado:"Fora da vitrine" };
const BRL = new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL",maximumFractionDigits:0});
const NUM = new Intl.NumberFormat("pt-BR",{maximumFractionDigits:2});
const DT = new Intl.DateTimeFormat("pt-BR",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"});
const META_KEYS = ["id","corretorId","codigo","status","notaGestor","orcar3d","historico","criadoEm","atualizadoEm"];

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fotoUrl = p => /^https?:\/\//i.test(String(p)) ? (/images\.unsplash\.com/.test(String(p)) ? String(p).split("?")[0]+"?w=1200&q=75&auto=format&fit=crop" : String(p)) : `${SUPA_URL}/storage/v1/object/public/fotos/${String(p).split("/").map(encodeURIComponent).join("/")}`;
const parseNum = s => { if(s===""||s==null) return null; if(typeof s==="number") return s; const t=String(s).replace(/[^\d,.-]/g,"").replace(/\.(?=\d{3}(\D|$))/g,"").replace(",","."); const n=Number(t); return isFinite(n)&&t!==""?n:null; };
const digits = s => String(s||"").replace(/\D/g,"");
const waNum = s => { const d=digits(s); return d.length>=10 && !d.startsWith("55") ? "55"+d : d; };
const now = () => new Date().toISOString();
const isTerreno = t => t==="Terreno / lote";
const isApto = t => t==="Apartamento"||t==="Cobertura";

/* ---------- estado ---------- */
const S = {
  session:null, uid:null, email:"", gestor:false,
  tab:"enviar", perfil:null, corretores:{}, itens:[], plano:{ chave:"profissional" },
  filtro:"pendente", aberto:null, editId:null, form:null, uploading:0, confirm:null, editPerfil:false,
  authModo:"entrar", authMsg:"", ready:false
};
const app = document.getElementById("app");
const sheetRoot = document.getElementById("sheetRoot");

function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,2800); }
async function copy(text){ try{ await navigator.clipboard.writeText(text); toast("Copiado."); }catch(e){ toast("Não deu para copiar. Selecione o texto e copie."); } }
function falha(err, padrao){
  console.error(err);
  const m = String(err?.message||"");
  if(/row-level security|permission|42501/i.test(m)) return "Sua conta não tem permissão para essa ação.";
  if(/JWT|session/i.test(m)) return "Sua sessão expirou. Entre de novo.";
  return padrao;
}

/* ---------- linha do banco <-> item ---------- */
function rowToItem(r){
  return { ...(r.dados||{}), id:r.id, corretorId:r.corretor_id, codigo:r.codigo, status:r.status,
    notaGestor:r.nota_gestor, orcar3d:r.orcar_3d, historico:r.historico||[], criadoEm:r.criado_em, atualizadoEm:r.atualizado_em };
}
function dadosDe(it){ const d={...it}; META_KEYS.forEach(k=>delete d[k]); delete d.plantaTipo; return d; }

/* ---------- completude ---------- */
function avaliar(it){
  const req=[], rec=[];
  const fotos=(it.fotos||[]).length;
  req.push({ok:!!it.tipo, txt:"Tipo do imóvel"});
  req.push({ok:!!it.bairro, txt:"Bairro"});
  req.push({ok:!!it.area, txt:"Metragem"});
  if(!isTerreno(it.tipo)) req.push({ok:it.quartos!=null, txt:"Número de quartos"});
  req.push({ok:!!it.valor, txt:"Valor"});
  req.push({ok:fotos>=1, txt:"Pelo menos 1 foto"});
  req.push({ok:!!it.autorizado, txt:"Autorização do proprietário"});
  rec.push({ok:fotos>=8, txt: fotos>=8 ? "8 fotos ou mais" : `Mais fotos (${fotos} de 8)`, pedir:"Envie mais fotos: sala, cozinha, quartos, banheiros, área externa e vista. O ideal são 8 ou mais."});
  rec.push({ok:!!it.planta, txt:"Planta baixa", pedir:"Envie a planta baixa (foto ou PDF) se tiver."});
  rec.push({ok:(it.descricao||"").length>=120, txt:"Descrição com detalhes", pedir:"Complete a descrição: estado de conservação, o que fica no imóvel, sol e vista."});
  rec.push({ok:(it.diferenciais||[]).length>=2, txt:"Dois diferenciais ou mais", pedir:"Marque os diferenciais do imóvel (vista, piscina, pet, etc.)."});
  if(!isTerreno(it.tipo)) rec.push({ok:it.vagas!=null, txt:"Vagas de garagem", pedir:"Informe as vagas de garagem."});
  if(isApto(it.tipo)||it.tipo==="Casa em condomínio") rec.push({ok:it.condominio!=null, txt:"Valor do condomínio", pedir:"Informe o valor do condomínio."});
  rec.push({ok:!!it.video, txt:"Vídeo ou tour", pedir:"Se tiver, mande o link de um vídeo curto do imóvel."});
  const reqOk=req.filter(x=>x.ok).length, recOk=rec.filter(x=>x.ok).length;
  const pct=Math.round((reqOk/req.length)*70 + (recOk/rec.length)*30);
  return { req, rec, pct, completo: reqOk===req.length };
}
function tituloDe(it){ const q = it.quartos ? ` ${it.quartos} quarto${it.quartos>1?"s":""}` : ""; return `${it.tipo||"Imóvel"}${isTerreno(it.tipo)?"":q}${it.bairro?" · "+it.bairro:""}`; }

/* ---------- boot / auth ---------- */
async function boot(){
  const { data } = await sb.auth.getSession();
  await aplicarSessao(data.session);
  sb.auth.onAuthStateChange((evt, session)=>{
    if(evt==="SIGNED_IN" || evt==="SIGNED_OUT") aplicarSessao(session);
  });
  setInterval(()=>{ if(S.uid && !document.hidden && !S.uploading) carregar(); }, 45000);
  document.addEventListener("visibilitychange", ()=>{ if(!document.hidden && S.uid) carregar(); });
}
async function aplicarSessao(session){
  const uid = session?.user?.id || null;
  if(uid===S.uid && S.ready) return;
  S.session=session; S.uid=uid; S.email=session?.user?.email||"";
  S.gestor=false; S.perfil=null; S.itens=[]; S.corretores={}; S.aberto=null; S.form=null; S.editId=null;
  if(uid){
    const { data:g } = await sb.rpc("is_gestor");
    S.gestor = !!g;
    S.tab = S.gestor ? "gestao" : "enviar";
    try{ const h=location.hash.slice(1); if(h==="enviar"||(h==="gestao"&&S.gestor)) S.tab=h; }catch(e){}
    await carregar();
  }
  S.ready=true; render();
}
async function carregar(){
  const tasks = [
    sb.from("corretores").select("*"),
    sb.from("imoveis").select("*").order("atualizado_em",{ascending:false})
  ];
  if(S.gestor) tasks.push(sb.from("config").select("*").eq("chave","plano").maybeSingle());
  const [c, i, p] = await Promise.all(tasks);
  if(c.error||i.error){ toast(falha(c.error||i.error,"Não foi possível carregar as fichas.")); return; }
  S.corretores = Object.fromEntries((c.data||[]).map(r=>[r.id, r]));
  S.perfil = S.corretores[S.uid] || null;
  S.itens = (i.data||[]).map(rowToItem);
  if(p && p.data) S.plano = p.data.valor;
  render();
}
function todosItens(){ return S.itens; }
function meusItens(){ return S.itens.filter(i=>i.corretorId===S.uid); }

/* ---------- render ---------- */
function render(){
  if(!S.ready) return;
  renderTop();
  if(S.recuperando && S.uid){ app.innerHTML = novaSenhaHTML(); sheetRoot.innerHTML=""; return; }
  if(!S.uid){ app.innerHTML = loginHTML(); sheetRoot.innerHTML=""; return; }
  if(S.tab==="gestao" && S.gestor) app.innerHTML = gestaoHTML();
  else renderEnviar();
  renderSheet();
}
function renderTop(){
  const tabs=[];
  if(S.uid){
    if(S.gestor){ const n=todosItens().filter(i=>i.status==="pendente").length; tabs.push(["gestao","Gestão",n]); }
    const n=meusItens().filter(i=>i.status==="ajuste").length; tabs.push(["enviar",S.gestor?"Enviar imóvel":"Meus imóveis",n]);
  }
  const el=document.getElementById("tabs");
  el.innerHTML = tabs.map(([k,l,n])=>`<button type="button" data-tab="${k}" aria-pressed="${S.tab===k}">${l}${n?`<span class="n">${n}</span>`:""}</button>`).join("")
    + `<a class="tablink" href="/imoveis.html">Vitrine</a>`;
  const role = S.gestor ? "Gestor" : S.uid ? "Corretor" : "";
  document.getElementById("who").innerHTML = S.uid
    ? `<span title="${esc(S.email)}">${esc(S.perfil?.nome||S.email)}</span><span class="role">${role}</span><button class="link" type="button" id="sair">Sair</button>`
    : "";
}
document.getElementById("tabs").addEventListener("click",e=>{
  const b=e.target.closest("[data-tab]"); if(!b) return;
  S.tab=b.dataset.tab; S.aberto=null; try{ history.replaceState(null,"","#"+S.tab); }catch(err){}
  render(); window.scrollTo(0,0);
});
document.getElementById("who").addEventListener("click", async e=>{
  if(e.target.id==="sair"){ await sb.auth.signOut(); }
});

/* ---------- login ---------- */

  const cad = S.authModo==="cadastrar", rec = S.authModo==="recuperar";
  return `<section class="auth">
    <div class="auth-intro">
      <div class="eyebrow">Portal da equipe</div>
      <h2>${cad?"Crie sua conta de corretor":rec?"Recuperar a senha":"Entre para cadastrar imóveis"}</h2>
      <p>Os corretores enviam a ficha do imóvel por aqui. O gestor revisa, pede o que faltar e publica na vitrine de imóveis.</p>
    </div>
    <form class="card" id="authForm" novalidate>
      <div class="f"><label for="aEmail">E-mail</label><input id="aEmail" type="email" autocomplete="email" required></div>
      ${rec?"":`<div class="f"><label for="aSenha">Senha</label><input id="aSenha" type="password" autocomplete="${cad?"new-password":"current-password"}" minlength="6" required>${cad?`<span class="hint">Mínimo de 6 caracteres.</span>`:""}</div>`}
      ${S.authMsg?`<p class="${S.authMsg.startsWith("!")?"err":"okmsg"}">${esc(S.authMsg.replace(/^!/,""))}</p>`:""}
      <button class="btn lamp" type="submit" id="aBtn">${cad?"Criar conta":rec?"Enviar link de nova senha":"Entrar"}</button>
      <div style="display:flex;gap:16px;flex-wrap:wrap">
        ${cad||rec?`<button class="link" type="button" data-modo="entrar">Já tenho conta</button>`:`<button class="link" type="button" data-modo="cadastrar">Criar conta de corretor</button><button class="link" type="button" data-modo="recuperar">Esqueci a senha</button>`}
      </div>
    </form>
  </section>`;
}
app.addEventListener("click", e=>{
  const m=e.target.closest("[data-modo]"); if(!m) return;
  S.authModo=m.dataset.modo; S.authMsg=""; render();
});
app.addEventListener("submit", async e=>{
  if(e.target.id!=="authForm") return;
  e.preventDefault();
  const email=document.getElementById("aEmail").value.trim();
  const senha=document.getElementById("aSenha")?.value||"";
  const btn=document.getElementById("aBtn");
  if(!/^\S+@\S+\.\S+$/.test(email)){ S.authMsg="!Digite um e-mail válido."; render(); return; }
  if(S.authModo!=="recuperar" && senha.length<6){ S.authMsg="!A senha precisa ter pelo menos 6 caracteres."; render(); document.getElementById("aEmail").value=email; return; }
  btn.disabled=true;
  const volta = location.origin + location.pathname;
  let r;
  if(S.authModo==="cadastrar") r = await sb.auth.signUp({ email, password:senha, options:{ emailRedirectTo: volta } });
  else if(S.authModo==="recuperar") r = await sb.auth.resetPasswordForEmail(email, { redirectTo: volta });
  else r = await sb.auth.signInWithPassword({ email, password:senha });
  btn.disabled=false;
  if(r.error){
    const m=r.error.message||"";
    S.authMsg = /Invalid login/i.test(m) ? "!E-mail ou senha incorretos."
      : /not confirmed/i.test(m) ? "!Confirme seu e-mail pelo link que enviamos antes de entrar."
      : /already registered/i.test(m) ? "!Esse e-mail já tem conta. Use “Já tenho conta”."
      : /rate limit/i.test(m) ? "!Muitas tentativas seguidas. Espere alguns minutos."
      : "!Não foi possível continuar: "+m;
    render(); document.getElementById("aEmail").value=email; return;
  }
  if(S.authModo==="cadastrar" && !r.data.session){ S.authMsg="Conta criada. Abra o e-mail que enviamos e clique no link para confirmar."; S.authModo="entrar"; render(); return; }
  if(S.authModo==="recuperar"){ S.authMsg="Se o e-mail tiver conta, chega um link para criar uma nova senha."; render(); return; }
});

/* recuperação de senha */
function novaSenhaHTML(){ return `<section class="auth"><div class="auth-intro"><div class="eyebrow">Nova senha</div><h2>Defina sua nova senha</h2><p>Digite a senha nova para ${esc(S.email||"sua conta")}.</p></div>
      <form class="card" id="novaSenha" novalidate><div class="f"><label for="nSenha">Nova senha</label><input id="nSenha" type="password" minlength="6" autocomplete="new-password"><span class="hint">Mínimo de 6 caracteres.</span></div>
      <button class="btn lamp" type="submit">Salvar nova senha</button></form></section>`; }
sb.auth.onAuthStateChange((evt, session)=>{
  if(evt==="PASSWORD_RECOVERY"){ S.recuperando=true; S.email=session?.user?.email||S.email; if(S.ready) render(); }

app.addEventListener("submit", async ev=>{
  if(ev.target.id!=="novaSenha") return;
  ev.preventDefault();

/* ---------- GESTÃO ---------- */
function mesAtual(it){ const d=new Date(it.criadoEm||0), n=new Date(); return d.getMonth()===n.getMonth() && d.getFullYear()===n.getFullYear(); }
function gestaoHTML(){
  const all = todosItens();
  const plano = PLANOS[S.plano.chave] || PLANOS.profissional;
  const mes = all.filter(mesAtual).length;
  const pct = Math.min(100, mes/plano.limite*100);
  const exced = Math.max(0, mes-plano.limite);
  const cnt = k => all.filter(i=>i.status===k).length;
  const lista = all.filter(i=> S.filtro==="todos" ? true : S.filtro==="fora" ? (i.status==="vendido"||i.status==="arquivado") : i.status===S.filtro);
  const nCorr = Object.keys(S.corretores).length;
  const filtros = [["pendente","Aguardando",cnt("pendente")],["ajuste","Em ajuste",cnt("ajuste")],["publicado","Na vitrine",cnt("publicado")],["fora","Vendidos e arquivados",cnt("vendido")+cnt("arquivado")],["todos","Todos",all.length]];
  return `<section class="view" aria-labelledby="hG">
    <div class="head"><div><div class="eyebrow">Painel do gestor</div><h2 id="hG">Fichas enviadas pelos corretores</h2>
      <p>Revise cada ficha, peça o que faltar e publique na vitrine. ${nCorr} corretor${nCorr===1?"":"es"} com cadastro no portal.</p></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" type="button" id="atualizar">Atualizar</button><button class="btn" type="button" data-go="enviar">Enviar um imóvel de teste</button></div></div>
    <div class="strip">
      <div>
        <div class="eyebrow">Cadastros em ${new Intl.DateTimeFormat("pt-BR",{month:"long"}).format(new Date())}</div>
        <div class="big mono">${mes}<small>de ${plano.limite}</small></div>
        <div class="quota ${exced?"over":""}"><i style="width:${pct}%"></i></div>
        <div class="plan-row"><label for="planoSel">Plano</label>
          <select id="planoSel">${Object.entries(PLANOS).map(([k,p])=>`<option value="${k}" ${k===S.plano.chave?"selected":""}>${p.nome} · até ${p.limite}/mês · ${BRL.format(p.preco)}</option>`).join("")}</select>
          ${exced?`<span style="color:var(--fix)">${exced} acima: ${BRL.format(exced*EXCEDENTE)} de excedente</span>`:`<span>${plano.limite-mes} restantes</span>`}</div>
      </div>
      <div><div class="eyebrow">Aguardando</div><div class="big mono">${cnt("pendente")}</div></div>
      <div><div class="eyebrow">Em ajuste</div><div class="big mono">${cnt("ajuste")}</div></div>
      <div><div class="eyebrow">Na vitrine</div><div class="big mono">${cnt("publicado")}</div></div>
    </div>
    <div class="chips" role="group" aria-label="Filtrar por situação">${filtros.map(([k,l,n])=>`<button type="button" data-filtro="${k}" aria-pressed="${S.filtro===k}">${l} · ${n}</button>`).join("")}</div>
    <div class="list">${lista.length ? lista.map(rowHTML).join("") : emptyGestao(all.length)}</div>
  </section>`;
}
function emptyGestao(total){
  if(!total) return `<div class="empty"><b>Nenhuma ficha ainda</b><p>Quando um corretor enviar um imóvel, ele aparece aqui para revisão. Para testar agora, use “Enviar um imóvel de teste”.</p></div>`;
  return `<div class="empty"><b>Nada nesta situação</b><p>Troque o filtro acima para ver as outras fichas.</p></div>`;
}

/* ---------- detalhe (sheet) ---------- */
function acharItem(id){ return id ? S.itens.find(i=>i.id===id)||null : null; }
function renderSheet(){
  const it = acharItem(S.aberto);
  if(!it){ sheetRoot.innerHTML=""; return; }
  const a=avaliar(it), c=S.corretores[it.corretorId] || {};
  const gestor = S.gestor;
  const fotos=(it.fotos||[]);
  const gal = fotos.length ? `<div class="gallery">${fotos.slice(0,7).map(f=>`<a href="${fotoUrl(f)}" target="_blank" rel="noopener"><img src="${fotoUrl(f)}" alt="Foto do imóvel" loading="lazy"></a>`).join("")}</div>${fotos.length>7?`<p style="font-size:12.5px;color:var(--muted)">+${fotos.length-7} fotos</p>`:""}` : `<div class="note"><b>Sem fotos</b>Esta ficha ainda não tem fotos.</div>`;
  const facts = [
    ["Finalidade", it.finalidade], ["Área", it.area?NUM.format(it.area)+" m²":"—"], ["Quartos", it.quartos ?? "—"],
    ["Suítes", it.suites ?? "—"], ["Banheiros", it.banheiros ?? "—"], ["Vagas", it.vagas ?? "—"],
    ["Valor", it.valor?BRL.format(it.valor):"—"], ["Condomínio", it.condominio!=null?BRL.format(it.condominio):"—"], ["IPTU/ano", it.iptu!=null?BRL.format(it.iptu):"—"],
    ["Andar", it.andar||"—"], ["Cidade", it.cidade||"—"], ["Pagamento", [it.financiamento&&"Financia",it.fgts&&"FGTS",it.permuta&&"Permuta"].filter(Boolean).join(" · ")||"—"]
  ].map(([k,v])=>`<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join("");
  const sugestao = a.rec.filter(x=>!x.ok).map(x=>"• "+x.pedir).join("\n");
  let foot="";
  const conf = S.confirm;
  if(gestor){
    if(conf==="ajuste"){
      foot = `<div class="f" style="width:100%"><label for="notaAjuste">O que o corretor precisa ajustar</label><textarea id="notaAjuste">${esc(sugestao)}</textarea></div>
        <button class="btn lamp" type="button" data-acao="enviarAjuste">Enviar pedido ao corretor</button><button class="btn ghost" type="button" data-acao="cancelar">Cancelar</button>`;
    } else if(conf==="excluir"){
      foot = `<div class="confirm">Excluir esta ficha de vez? Ela some do painel e da vitrine.
        <button class="btn warn sm" type="button" data-acao="excluirSim">Excluir ficha</button><button class="btn ghost sm" type="button" data-acao="cancelar">Manter</button></div>`;
    } else if(it.status==="pendente"||it.status==="ajuste"||it.status==="arquivado"){
      foot = `<button class="btn lamp" type="button" data-acao="publicar" ${a.completo?"":"disabled"}>Aprovar e publicar</button>
        <button class="btn" type="button" data-acao="ajuste">Pedir ajuste</button>
        <button class="btn ghost" type="button" data-acao="tag3d">${it.orcar3d?"Tirar marca de 3D":"Marcar para orçar 3D"}</button>
        <button class="btn warn" type="button" data-acao="excluir">Excluir</button>
        ${a.completo?"":`<p class="err" style="width:100%">Para publicar, a ficha precisa dos itens obrigatórios marcados em laranja.</p>`}`;
    } else if(it.status==="publicado"){
      foot = `<button class="btn lamp" type="button" data-acao="vendido">Marcar como vendido</button>
        <button class="btn" type="button" data-acao="tirar">Tirar da vitrine</button>
        <button class="btn ghost" type="button" data-acao="copiarLink">Copiar link do anúncio</button>`;
    } else if(it.status==="vendido"){

function hist(it,acao){ return [...(it.historico||[]), {em:now(), acao}].slice(-30); }
function vitrineRow(it){
  const c=S.corretores[it.corretorId]||{};
  const pub = {};
  ["finalidade","tipo","bairro","cidade","area","quartos","suites","banheiros","vagas","andar","valor","condominio","iptu","financiamento","fgts","permuta","diferenciais","descricao","fotos","planta","video","lancamento"].forEach(k=>{ if(it[k]!==undefined && it[k]!==null) pub[k]=it[k]; });
  if(!it.ocultarEndereco && it.endereco) pub.endereco=it.endereco;
  return { id:it.id, codigo:it.codigo, dados:pub, corretor_nome:c.nome||"", corretor_whats:waNum(c.whatsapp||""), vendido:false, publicado_em:now() };
}
async function atualizarItem(it, campos){
  const { error } = await sb.from("imoveis").update({ ...campos, atualizado_em:now() }).eq("id", it.id);
  if(error) throw error;
}
sheetRoot.addEventListener("click", async e=>{
  const b=e.target.closest("[data-acao]"); if(!b) return;
  const it=acharItem(S.aberto); const acao=b.dataset.acao;
  if(acao==="fechar"){ S.aberto=null; S.confirm=null; renderSheet(); return; }
  if(!it) return;
  if(acao==="cancelar"){ S.confirm=null; renderSheet(); return; }
  if(acao==="ajuste"||acao==="excluir"){ S.confirm=acao; renderSheet(); return; }
  if(acao==="editar"){ abrirEdicao(it); return; }
  if(acao==="copiarLink"){ copy(`${location.origin}/imoveis.html#${it.codigo}`); return; }
  b.disabled=true;
  try{
    if(acao==="publicar"){
      const { error } = await sb.from("vitrine").upsert(vitrineRow(it));
      if(error) throw error;
      await atualizarItem(it, {status:"publicado", nota_gestor:"", historico:hist(it,"Aprovado e publicado na vitrine")});
      toast("Publicado na vitrine.");
    } else if(acao==="enviarAjuste"){
      const nota=(document.getElementById("notaAjuste").value||"").trim();
      if(!nota){ toast("Escreva o que o corretor precisa ajustar."); b.disabled=false; return; }
      await atualizarItem(it, {status:"ajuste", nota_gestor:nota, historico:hist(it,"Ajuste pedido ao corretor")});
      S.confirm=null; toast("Pedido enviado. O corretor vê na área dele.");
    } else if(acao==="tag3d"){
      await atualizarItem(it, {orcar_3d:!it.orcar3d, historico:hist(it, it.orcar3d?"Marca de 3D removida":"Marcado para orçar tabela 3D")});
    } else if(acao==="vendido"){
      const { error } = await sb.from("vitrine").update({vendido:true}).eq("id", it.id);
      if(error) throw error;
      await atualizarItem(it, {status:"vendido", historico:hist(it,"Marcado como vendido")});
      toast("Marcado como vendido.");
    } else if(acao==="tirar"){
      const { error } = await sb.from("vitrine").delete().eq("id", it.id);
      if(error) throw error;
      await atualizarItem(it, {status:"arquivado", historico:hist(it,"Retirado da vitrine")});
      toast("Retirado da vitrine.");
    } else if(acao==="excluirSim"){
      const { error } = await sb.from("imoveis").delete().eq("id", it.id);
      if(error) throw error;
      const arquivos=[...(it.fotos||[]), it.planta].filter(Boolean);
      if(arquivos.length) await sb.storage.from("fotos").remove(arquivos);
      S.aberto=null; S.confirm=null; toast("Ficha excluída.");
    }
    await carregar();
  }catch(err){ toast(falha(err,"Não foi possível salvar. Tente de novo em instantes.")); b.disabled=false; }
});

app.addEventListener("click", async e=>{
  if(!S.uid) return;
  if(e.target.id==="atualizar"){ await carregar(); toast("Fichas atualizadas."); return; }
  const go=e.target.closest("[data-go]"); if(go){ S.tab=go.dataset.go; render(); window.scrollTo(0,0); return; }

function fToItem(f){
  const n=k=>parseNum(f[k]);
  return { ...f, area:n("area"), quartos:n("quartos"), suites:n("suites"), banheiros:n("banheiros"), vagas:n("vagas"), valor:n("valor"), condominio:n("condominio"), iptu:n("iptu"), unidades:n("unidades") };
}
function syncField(el){
  const k=el.dataset.k; if(!k) return false;
  if(el.type==="checkbox") S.form[k]=el.checked; else S.form[k]=el.value;
  return true;
}
let refreshT;
app.addEventListener("input", e=>{
  if(!S.uid || !document.getElementById("ficha")) return;
  const el=e.target;
  if(el.closest("#ficha") && syncField(el)){
    clearTimeout(refreshT);
    if(["tipo","lancamento","finalidade"].includes(el.dataset.k)) renderEnviar(); else refreshT=setTimeout(refreshSide,250);
  }
});
app.addEventListener("change", e=>{
  if(!S.uid || !document.getElementById("ficha")) return;
  const el=e.target;
  if(el.name==="finalidade"){ S.form.finalidade=el.value; renderEnviar(); return; }
  if(el.dataset.dif){ const d=el.dataset.dif; S.form.diferenciais = el.checked ? [...S.form.diferenciais,d] : S.form.diferenciais.filter(x=>x!==d); refreshSide(); return; }
  if(el.type==="checkbox" && el.dataset.k){ syncField(el); if(el.dataset.k==="lancamento") renderEnviar(); else refreshSide(); return; }
  if(el.tagName==="SELECT" && el.dataset.k){ syncField(el); renderEnviar(); return; }
  if(el.id==="f_fotos"){ subirFotos([...el.files]); el.value=""; return; }
  if(el.id==="f_planta"){ subirPlanta(el.files[0]); el.value=""; return; }
});
function refreshSide(){
  const side=app.querySelector(".side"); if(!side) return;
  const tmp=document.createElement("div"); tmp.innerHTML=enviarHTML();
  side.replaceWith(tmp.querySelector(".side"));
  const hint=app.querySelector("#f_descricao + .hint"); if(hint) hint.textContent=`${S.form.descricao.length} caracteres · ideal a partir de 120`;
}
app.addEventListener("dragover", e=>{ const d=e.target.closest("#drop"); if(d){ e.preventDefault(); d.classList.add("over"); }});

async function reduzir(file){
  try{
    const bmp = await createImageBitmap(file);
    const max=1600, sc=Math.min(1, max/Math.max(bmp.width,bmp.height));
    const c=document.createElement("canvas"); c.width=Math.round(bmp.width*sc); c.height=Math.round(bmp.height*sc);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(b=>r(b||file),"image/jpeg",.82));
  }catch(e){ return file; }
}
function novoNome(ext){ return `${S.uid}/${Date.now().toString(36)}-${Math.random().toString(36).slice(2,8)}.${ext}`; }
async function enviarArquivo(blob, ext, tipo){
  const path=novoNome(ext);
  const { error } = await sb.storage.from("fotos").upload(path, blob, { contentType:tipo, upsert:false });
  if(error) throw error;
  return path;
}
async function subirFotos(files){
  if(!files.length) return;
  S.uploading+=files.length; renderEnviar();
  for(const file of files){
    try{
      const b=await reduzir(file);
      const tipo = b.type && /^image\/(jpeg|png|webp)$/.test(b.type) ? b.type : "image/jpeg";
      const path=await enviarArquivo(b, tipo==="image/png"?"png":tipo==="image/webp"?"webp":"jpg", tipo);
      S.form.fotos=[...S.form.fotos, path];
    }catch(err){ toast(/size|large/i.test(err?.message||"")?"Uma foto passou de 20 MB e ficou de fora.":falha(err,"Uma foto não subiu. Tente de novo.")); }
    S.uploading--; renderEnviar();
  }
}
async function subirPlanta(file){
  if(!file) return;
  S.uploading++; renderEnviar();
  try{
    const isPdf = file.type==="application/pdf";
    const b = isPdf ? file : await reduzir(file);
    S.form.planta = await enviarArquivo(b, isPdf?"pdf":"jpg", isPdf?"application/pdf":"image/jpeg");
  }catch(err){ toast(falha(err,"A planta não subiu. Tente de novo.")); }
  S.uploading--; renderEnviar();
}
app.addEventListener("click", async e=>{
  if(!S.uid || !document.getElementById("ficha") && e.target.id!=="salvarPerfil" && e.target.id!=="editPerfil") return;
  const rm=e.target.closest("[data-rmfoto]"); if(rm){ const i=+rm.dataset.rmfoto; S.form.fotos=S.form.fotos.filter((_,j)=>j!==i); renderEnviar(); return; }
  if(e.target.id==="rmPlanta"){ S.form.planta=null; renderEnviar(); return; }
  if(e.target.id==="editPerfil"){ S.editPerfil=true; renderEnviar(); return; }
  if(e.target.id==="cancelEdit"){ S.editId=null; S.form=formVazio(); renderEnviar(); return; }
  if(e.target.id==="salvarPerfil"){
    const nome=document.getElementById("pNome").value.trim(), creci=document.getElementById("pCreci").value.trim(), whatsapp=document.getElementById("pWhats").value.trim();
    if(!nome||digits(whatsapp).length<10){ toast("Preencha nome e um WhatsApp com DDD."); return; }
    e.target.disabled=true;
    const { error } = await sb.from("corretores").upsert({ id:S.uid, nome, creci, whatsapp, atualizado_em:now() });
    if(error){ toast(falha(error,"Não foi possível salvar. Tente de novo.")); e.target.disabled=false; return; }
    S.editPerfil=false; toast("Dados salvos."); await carregar();
    return;
  }
  if(e.target.id==="enviarFicha") enviarFicha(e.target);
});
function novoCodigo(){ const a="ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let s=""; for(let i=0;i<5;i++) s+=a[Math.floor(Math.random()*a.length)]; return "SPA-"+s; }
async function enviarFicha(btn){
  const errEl=document.getElementById("fErr");
  if(!S.perfil){ errEl.textContent="Salve seus dados de corretor no topo antes de enviar."; errEl.hidden=false; errEl.scrollIntoView({block:"center"}); return; }
  const it=fToItem(S.form), a=avaliar(it);
  const faltam=a.req.filter(x=>!x.ok && x.txt!=="Pelo menos 1 foto").map(x=>x.txt);
  if(faltam.length){ errEl.textContent="Falta preencher: "+faltam.join(", ")+"."; errEl.hidden=false; errEl.scrollIntoView({block:"center"}); return; }
  errEl.hidden=true; btn.disabled=true;
  const anterior = S.editId ? meusItens().find(i=>i.id===S.editId) : null;
  const dados = dadosDe(it);
  let res;
  if(anterior){
    res = await sb.from("imoveis").update({ dados, status:"pendente", nota_gestor:"", atualizado_em:now(), historico:hist(anterior,"Corretor reenviou a ficha") }).eq("id", anterior.id).select("codigo").single();
  } else {
    for(let tent=0; tent<3; tent++){
      res = await sb.from("imoveis").insert({ corretor_id:S.uid, codigo:novoCodigo(), status:"pendente", dados, historico:[{em:now(), acao:"Ficha enviada pelo corretor"}] }).select("codigo").single();
      if(!res.error || !/duplicate|unique/i.test(res.error.message)) break;
    }
  }
  btn.disabled=false;
  if(res.error){ toast(falha(res.error,"Não foi possível enviar. Tente de novo.")); return; }
  S.form=formVazio(); S.editId=null;
  toast(anterior?"Ficha reenviada para revisão.":`Ficha ${res.data.codigo} enviada para revisão.`);
  await carregar(); window.scrollTo(0,0);
}

document.addEventListener("keydown", e=>{ if(e.key==="Escape" && S.aberto){ S.aberto=null; S.confirm=null; renderSheet(); }});
boot().catch(err=>{ console.error(err); app.innerHTML=`<div class="notice"><b>Não foi possível abrir o portal</b><p style="color:var(--muted)">Verifique a internet e recarregue a página.</p></div>`; });
})();
</script>
